<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Jonatas & Flávia — AR V11.3</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Georgia,serif}
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:#f7f0df;text-align:center}
.card{width:min(430px,92vw);padding:34px 25px;border:1px solid #b17b2a;border-radius:22px;background:#fbf7eb;box-shadow:0 20px 70px #0002}
.monogram{font-size:54px;color:#7e642f}h1{font-size:30px;font-weight:500;margin:14px 0 6px}.sub{font-style:italic;opacity:.8;margin-bottom:25px}
button{border:0;border-radius:999px;padding:15px 25px;background:#a87931;color:white;font:600 16px Georgia,serif}
#status{position:fixed;z-index:30;top:18px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:#231e16cc;color:white;font:14px system-ui;display:none;white-space:nowrap}
#scan{position:fixed;z-index:15;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.box{width:min(76vw,430px);aspect-ratio:2/3;border:2px solid #fff8;border-radius:20px;box-shadow:0 0 0 9999px #0003}
</style>
</head>
<body>
<section id="intro"><div class="card">
<div class="monogram">J&nbsp;F</div>
<h1>Jonatas &amp; Flávia</h1>
<div class="sub">O amor encontrou o caminho</div>
<p>Aponte a câmera para o convite e veja a nossa história ganhar vida.</p>
<button id="start">Abrir experiência</button>
<p style="font-size:12px;opacity:.55">V11.3 — teste AR</p>
</div></section>
<div id="status"></div>
<div id="scan"><div class="box"></div></div>

<a-scene id="scene"
 mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
 renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
 vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded>
 <a-assets>
  <a-asset-item id="ramoDireitoAsset" src="./assets/ramo_direito_convite_15k.glb"></a-asset-item>
 </a-assets>
 <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
 <a-entity id="target" mindar-image-target="targetIndex:0">
   <a-gltf-model id="ramoTeste" src="#ramoDireitoAsset"
     position="0.43 -0.48 0.08" rotation="0 0 7" scale="0.001 0.001 0.001"
     animation="property:scale; from:0.001 0.001 0.001; to:0.36 0.36 0.36; dur:1400; easing:easeOutCubic; startEvents:show"></a-gltf-model>
 </a-entity>
</a-scene>

<script>
(function(){
 const scene=document.getElementById('scene');
 const start=document.getElementById('start');
 const intro=document.getElementById('intro');
 const status=document.getElementById('status');
 const scan=document.getElementById('scan');
 const target=document.getElementById('target');

 function show(t){status.textContent=t;status.style.display='block'}
 function hide(){status.style.display='none'}

 start.addEventListener('click', async function(){
   start.disabled=true;
   intro.style.display='none';
   scan.style.display='flex';
   show('Preparando o AR…');
   try{
     if(!scene.hasLoaded) await new Promise((resolve,reject)=>{
       const timer=setTimeout(()=>reject(new Error('A-Frame não terminou de carregar.')),12000);
       scene.addEventListener('loaded',()=>{clearTimeout(timer);resolve()},{once:true});
     });
     const sys=scene.systems['mindar-image-system'];
     if(!sys) throw new Error('MindAR não foi encontrado.');
     show('Solicitando acesso à câmera…');
     await sys.start();
     show('Aponte para o convite');
   }catch(e){
     console.error(e);
     show('Erro ao iniciar AR: '+(e.name||e.message||'desconhecido'));
     setTimeout(()=>{scan.style.display='none';intro.style.display='flex';start.disabled=false},5000);
   }
 });

 target.addEventListener('targetFound',function(){
   scan.style.display='none';
   show('✨ Convite reconhecido!');
   target.querySelector('#ramoTeste').emit('show');
   setTimeout(hide,2200);
 });
 target.addEventListener('targetLost',function(){
   scan.style.display='flex';
   show('Aponte novamente para o convite');
 });
})();
</script>
</body>
</html>
