<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Convite AR — Teste de câmera</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
    body{display:flex;align-items:center;justify-content:center;text-align:center}
    .box{width:min(88vw,420px);padding:28px}
    h1{font-size:25px;margin:0 0 12px}
    p{line-height:1.5;opacity:.9}
    button{margin-top:18px;width:100%;padding:17px 20px;border:0;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer}
    #status{margin-top:20px;min-height:50px;font-size:15px;white-space:pre-line}
    video{display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
    #back{display:none;position:fixed;top:20px;left:20px;width:auto;padding:12px 16px}
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <button id="back">← Voltar</button>
  <main class="box" id="ui">
    <h1>Teste de câmera</h1>
    <p>Esta é uma página de diagnóstico da V11. Ela não usa MindAR nem os modelos 3D.</p>
    <button id="start">TESTAR CÂMERA</button>
    <div id="status">Toque no botão para iniciar o teste.</div>
  </main>

<script>
(function(){
  const start=document.getElementById('start');
  const status=document.getElementById('status');
  const video=document.getElementById('video');
  const ui=document.getElementById('ui');
  const back=document.getElementById('back');

  function msg(t){ status.textContent=t; }

  start.addEventListener('click', async function(){
    msg('1/3 — Clique recebido.\\n2/3 — Solicitando acesso à câmera…');
    start.disabled=true;

    try {
      if (!window.isSecureContext) {
        throw new Error('SECURE_CONTEXT');
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('NO_GETUSERMEDIA');
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'}},
        audio:false
      });

      video.srcObject=stream;
      video.style.display='block';
      ui.style.display='none';
      back.style.display='block';
      msg('3/3 — Câmera aberta com sucesso.');
    } catch(e) {
      let text='Falha ao abrir a câmera.\\n\\n';
      if(e && e.name==='NotAllowedError') text+='PERMISSÃO NEGADA/BLOQUEADA pelo navegador.';
      else if(e && e.name==='NotFoundError') text+='NENHUMA CÂMERA foi encontrada.';
      else if(e && e.name==='NotReadableError') text+='A CÂMERA ESTÁ SENDO USADA por outro aplicativo.';
      else if(e && e.message==='SECURE_CONTEXT') text+='A página não está em HTTPS.';
      else if(e && e.message==='NO_GETUSERMEDIA') text+='O navegador não disponibilizou acesso à câmera.';
      else text+='Erro: '+(e?.name||'desconhecido')+' — '+(e?.message||String(e));
      msg(text);
      start.disabled=false;
    }
  });

  back.addEventListener('click',()=>{
    if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
    video.srcObject=null;
    video.style.display='none';
    back.style.display='none';
    ui.style.display='block';
    start.disabled=false;
    msg('Teste encerrado.');
  });
})();
</script>
</body>
</html>
